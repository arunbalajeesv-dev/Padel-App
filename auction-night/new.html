<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New auction — Auction Night</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow"><span class="dot"></span><span>New auction</span></div>
      <h1>Set the table</h1>
    </div>
    <div class="top-actions">
      <a class="ghost" href="./">All auctions</a>
    </div>
  </header>

  <form class="card" id="form">
    <div class="field">
      <label for="title">Auction name</label>
      <input id="title" placeholder="e.g. Sunday Padel Draft" maxlength="80" autocomplete="off">
    </div>

    <div class="row2">
      <div class="field">
        <label for="purse">Coins per captain</label>
        <input id="purse" type="number" min="100" step="100" value="30000">
      </div>
      <div class="field">
        <label for="slots">Roster slots per team</label>
        <input id="slots" type="number" min="1" max="10" value="3">
      </div>
    </div>

    <div class="field">
      <label>Teams (2–8 captains)</label>
      <div id="teams"></div>
      <button type="button" class="mini" id="addTeam" style="margin-top:4px">+ Add team</button>
      <p class="hint">Each team is named after its captain, same as a real auction.</p>
    </div>

    <p class="formerr" id="formErr" hidden></p>
    <div class="formactions">
      <button type="submit" class="primary" id="createBtn">Create auction</button>
    </div>
  </form>
</div>
<script src="shared.js"></script>
<script src="new.js"></script>
</body>
</html>
