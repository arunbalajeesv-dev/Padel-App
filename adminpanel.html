<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padel App - Admin Console</title>
<style>
  /* Base Reset & Typography */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    background-color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
    color: #333;
  }

  /* Desktop Frame Constraints */
  .desktop-frame {
    width: 1440px;
    height: 900px;
    background-color: #f9f9f9;
    border: 4px solid #222;
    border-radius: 12px;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    display: flex;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    background-color: #222;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 24px 0;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 0 24px 32px;
    border-bottom: 1px solid #444;
    margin-bottom: 24px;
  }
  .sidebar-header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .nav-menu {
    list-style: none;
    display: flex;
    flex-direction: column;
  }
  .nav-item {
    padding: 16px 24px;
    font-size: 15px;
    font-weight: 500;
    color: #aaa;
    cursor: pointer;
    border-left: 4px solid transparent;
  }
  .nav-item.active {
    background-color: #333;
    color: #fff;
    border-left-color: #fff;
  }

  /* Main Content Area */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  
  /* Topbar */
  .topbar {
    height: 72px;
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    flex-shrink: 0;
  }
  .topbar h2 {
    font-size: 24px;
    font-weight: 600;
  }
  .admin-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 500;
  }
  .avatar-small {
    width: 32px;
    height: 32px;
    background: #d0d0d0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }

  /* Dashboard Body */
  .dashboard-body {
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  /* Stats Row */
  .stats-row {
    display: flex;
    gap: 24px;
  }
  .stat-card {
    flex: 1;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .stat-value {
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
  }
  .stat-label {
    font-size: 14px;
    color: #666;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* 2-Column Layout */
  .dashboard-grid {
    display: flex;
    gap: 32px;
    align-items: flex-start;
  }
  .primary-col {
