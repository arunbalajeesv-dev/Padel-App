<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padel Chennai — Admin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>Padel Chennai — Admin</h1>
        <button id="signOutBtn" class="btn-link" hidden type="button">Sign out</button>
      </header>

      <!-- Sign-in: same phone OTP flow as the player app, since the admin API
           is gated by a real Firebase ID token — there is no separate login. -->
      <section id="signInView" class="panel">
        <div id="phoneStep">
          <label class="field-label" for="phoneInput">Phone number</label>
          <input id="phoneInput" class="field" type="tel" inputmode="tel" value="+91" placeholder="+91 98765 43210" />
          <button id="sendCodeBtn" class="btn-primary" type="button">Send code</button>
        </div>
        <div id="codeStep" hidden>
          <label class="field-label" for="codeInput">6-digit code</label>
          <input id="codeInput" class="field" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
          <button id="verifyCodeBtn" class="btn-primary" type="button">Verify</button>
          <button id="restartBtn" class="btn-link" type="button">Use a different number</button>
        </div>
        <p id="signInError" class="error" role="alert" hidden></p>
        <div id="recaptcha-container"></div>
      </section>

      <section id="notAdminView" class="panel" hidden>
        <p>This account is not an admin.</p>
      </section>

      <section id="dashboardView" hidden>
        <nav class="tabs" aria-label="Admin sections">
          <button class="tab-btn" data-tab="stats" type="button">Stats</button>
          <button class="tab-btn" data-tab="disputes" type="button">
            Disputes <span id="disputeBadge" class="badge" hidden></span>
          </button>
          <button class="tab-btn" data-tab="history" type="button">History</button>
          <button class="tab-btn" data-tab="alerts" type="button">Weekly-gain alerts</button>
          <button class="tab-btn" data-tab="auctions" type="button">Auction Night</button>
        </nav>

        <section id="statsTab" class="tab-panel">
          <div id="statsContent">Loading…</div>
        </section>

        <section id="disputesTab" class="tab-panel" hidden>
          <div id="disputesContent">Loading…</div>
        </section>

        <section id="historyTab" class="tab-panel" hidden>
          <div id="historyContent">Loading…</div>
        </section>

        <section id="alertsTab" class="tab-panel" hidden>
          <div id="alertsContent">Loading…</div>
        </section>

        <section id="auctionsTab" class="tab-panel" hidden>
          <div class="panel" style="max-width:520px;margin-bottom:24px">
            <h3 style="margin-top:0">New auction</h3>
            <form id="auctionForm">
              <label class="field-label" for="aucTitle">Title</label>
              <input id="aucTitle" class="field" placeholder="e.g. Sunday Padel Draft" maxlength="80">

              <label class="field-label" for="aucPurse">Coins per captain</label>
              <input id="aucPurse" class="field" type="number" min="100" step="100" value="30000">

              <label class="field-label" for="aucSlots">Roster slots per team</label>
              <input id="aucSlots" class="field" type="number" min="1" max="10" value="3">

              <label class="field-label">Teams (2–8 captains)</label>
              <div id="aucTeams"></div>
              <button type="button" class="btn-small" id="aucAddTeam" style="width:auto;padding:0 12px;margin-bottom:12px">+ Add team</button>

              <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#555;margin-bottom:8px">
                <input type="checkbox" id="aucTimerOn" style="width:auto">
                Countdown timer per lot
              </label>
              <input id="aucTimerSeconds" class="field" type="number" min="10" max="600" step="5" value="30" hidden>

              <button type="submit" class="btn-primary" id="aucCreateBtn">Create auction</button>
              <p class="error" id="aucFormErr" hidden></p>
            </form>
          </div>

          <div id="auctionCreated"></div>

          <h3>All auctions</h3>
          <div id="auctionsContent">Loading…</div>
        </section>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
